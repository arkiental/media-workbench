name: Windows portable build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v0.2.5)
        required: true
permissions:
  contents: read
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Check the release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build
      - run: node scripts/package-portable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ env.TAG }}
          path: |
            release/*-portable.zip
            release/*-portable.zip.sha256
            release/portable-release.json
          if-no-files-found: error
      # Publish a portable asset only after clean-extraction and native workflow
      # verification. This workflow never overwrites an existing release asset.
